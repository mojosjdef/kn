    :root {

      --gold: #477BFF;
      --gold-light: #83A5FF;
      --line: rgba(104,145,255,.24);

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

      pointer-events: none;
    }
    .hero:after {
      content: ""; position: absolute; width: 340px; height: 340px; right: -50px; top: 50%;
      transform: translateY(-50%); border: 1px solid rgba(71,123,255,.09); border-radius: 50%;
      pointer-events: none;
    }
    .eyebrow {
      display: flex; align-items: center; gap: 12px; color: var(--gold);
      font-size: 11px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase;
      margin-bottom: 28px;
    }
    .eyebrow:before { content: ""; width: 28px; height: 1px; background: var(--gold); }
    h1 {
      max-width: 720px; margin: 0; font-size: clamp(42px, 6vw, 76px);
      line-height: .99; letter-spacing: -.065em; font-weight: 620;
    }
    h1 span { color: var(--gold-light); }
    .intro {

    .actions { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; margin-top: 36px; }
    .cta {

      min-height: 58px; padding: 0 25px; background: #477BFF; color: #FFFFFF;
      border: 1px solid #477BFF; border-radius: 3px; text-decoration: none;
      font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase;
      transition: background .18s ease, border-color .18s ease, transform .18s ease;
    }
    .cta:hover { background: #6892FF; border-color: #6892FF; transform: translateY(-1px); }
    .cta:focus-visible, a:focus-visible, button:focus-visible { outline: 2px solid var(--gold-light); outline-offset: 4px; }
    .cta .arrow { font-size: 18px; line-height: 1; }
    .microcopy { color: #8d897f; font-size: 12px; line-height: 1.6; }



    .orbit:before { inset: 22px; }
    .orbit:after { inset: 48px; }


    .orbit-label.top { top: 15%; left: 50%; transform: translateX(-50%); }
    .orbit-label.bottom { bottom: 15%; left: 50%; transform: translateX(-50%); }


















    .consent {
      position: fixed; z-index: 20; left: 16px; right: 16px; bottom: 16px; margin-inline: auto;
      max-width: 720px; padding: 18px; border: 1px solid var(--line); background: #11110ff5;
      box-shadow: 0 12px 50px #0008; backdrop-filter: blur(12px);
      display: none;
    }
    .consent.show { display: block; }
    .consent p { margin: 0 0 14px; color: #c7c2b7; font-size: 12px; line-height: 1.6; }
    .consent-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .consent button { cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--text); padding: 10px 13px; font: inherit; font-size: 11px; letter-spacing: .06em; }
    .consent button.primary { background: var(--gold); border-color: var(--gold); color: #111; font-weight: 750; }
    @media (max-width: 800px) {
      .wrap { width: min(100% - 36px, var(--max)); }
      .topbar { min-height: 70px; }
      .top-note { display: none; }
      .hero { grid-template-columns: 1fr; gap: 46px; min-height: 0; padding-block: 70px 64px; }
      .hero-copy { position: relative; z-index: 2; }
      .hero:before { width: 340px; height: 340px; right: -180px; top: auto; bottom: 0; transform: none; }
      .hero:after { width: 240px; height: 240px; right: -130px; top: auto; bottom: 50px; transform: none; }
                }
    @media (max-width: 420px) {
      .wrap { width: calc(100% - 32px); }
      .hero { padding-top: 56px; }
      h1 { font-size: clamp(39px, 12vw, 52px); }
      .actions { gap: 14px; }
      .actions .cta { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
